<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smolcoder — Panneau Git</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #d4d4d4;
    font-family: Consolas, "Courier New", monospace; font-size: 14px; }
  /* Global text size: the stylesheet is all px, so only Chromium's zoom
     actually rescales the window. The value is kept in localStorage. */
  body { zoom: var(--zoom, 1); }
  #zoomctl { display: flex; align-items: center; gap: 6px; margin-left: auto; border: 0; padding: 0; }
  #zoomctl .zl { color: #dcdcdc; font-size: 11px; }
  #zoomctl .zbar { position: relative; width: 96px; height: 16px; display: flex; align-items: center; }
  #zoomctl .zbar::before { content: ""; position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: #1b242a; }
  #zoomctl .zfill { position: absolute; left: 0; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #24727f, #43c6d6, #93f2ff); width: calc(var(--zpct, 0) * 1%); }
  #zoomctl input[type="range"] { position: relative; z-index: 2; width: 100%; height: 16px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
  #zoomctl input[type="range"]::-webkit-slider-runnable-track { height: 16px; background: transparent; }
  #zoomctl input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; margin-top: 2px; border-radius: 50%; background: #fff; border: 1px solid #007acc; }
  #zoomctl input[type="range"]::-moz-range-track { height: 16px; background: transparent; }
  #zoomctl input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 1px solid #007acc; }
  #zoomctl .zval { min-width: 38px; text-align: right; color: #fff; font-size: 11px; font-variant-numeric: tabular-nums; }
  #zoomctl .zstep { width: 20px; height: 20px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(255,255,255,.45); border-radius: 4px; color: #fff; cursor: pointer; line-height: 1; }
  #zoomctl .zstep:hover { background: rgba(255,255,255,.18); }
  #bar { display: flex; gap: 10px; align-items: center; padding: 10px 12px; min-height: 52px;
    background: #252526; border-bottom: 1px solid #3c3c3c; flex-wrap: wrap; }
  #bar h1 { font-size: 14px; margin: 0; font-family: Segoe UI, sans-serif; font-weight: 600; }
  #bar button { background: #0e639c; color: #fff; border: 0; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; font-size: 13px; min-height: 36px; line-height: 1.2; }
  #bar button:hover { background: #1177bb; }
  #bar button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #9cdcfe; outline-offset: 2px; }
  #filter { background: #1e1e1e; color: #d4d4d4; border: 1px solid #3c3c3c; border-radius: 6px;
    padding: 8px 10px; font: inherit; font-size: 13px; min-width: 160px; flex: 0 1 220px; }
  #root { color: #9cdcfe; font-size: 12.5px; flex: 1; min-width: 120px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #stats { padding: 8px 12px; font-size: 12.5px; color: #858585; background: #1e1e1e;
    border-bottom: 1px solid #3c3c3c; white-space: pre-wrap; font-family: Consolas, monospace;
    max-height: 90px; overflow: auto; }
  #stats:empty { display: none; }
  #main { display: flex; height: calc(100% - 210px); min-height: 200px; }
  #files { width: var(--files-w, 300px); min-width: 200px; overflow: auto; background: #252526;
    border-right: 1px solid #3c3c3c; padding: 8px 6px; line-height: 1.6; }
  /* Drag handle: the file column used to be stuck at 300px. */
  #filesgrip { flex: 0 0 7px; margin-left: -3px; margin-right: -3px; z-index: 9; cursor: col-resize; background: transparent; }
  #filesgrip:hover, body.dragging #filesgrip { background: #007acc; }
  #files .row { display: flex; gap: 8px; align-items: center; padding: 6px 8px;
    border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  #files .row:hover { background: #2a2d2e; }
  #files .row.open { background: #37373d; box-shadow: inset 2px 0 0 #007acc; }
  #files .path { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #files .empty { margin: 8px; padding: 20px 12px; color: #858585; font-size: 12.5px;
    line-height: 1.6; text-align: center; border: 1px dashed #3c3c3c; border-radius: 8px;
    font-family: Segoe UI, sans-serif; white-space: normal; }
  .badge { display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 5px; border-radius: 5px;
    font-size: 12px; font-weight: 700; font-family: Segoe UI, sans-serif; flex: none; }
  .b-A, .b-N { background: #16825d; color: #fff; }
  .b-M { background: #a67c00; color: #fff; }
  .b-D { background: #a1260d; color: #fff; }
  .b-R { background: #0e639c; color: #fff; }
  .b-Q { background: #3c3c3c; color: #d4d4d4; }
  #view { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #1e1e1e; }
  #fname { padding: 8px 12px; color: #4ec9b0; font-size: 13px; border-bottom: 1px solid #3c3c3c;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #diff { flex: 1; overflow: auto; margin: 0; padding: 12px 14px; font: inherit;
    line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  #diff .add { color: #9ece6a; background: rgba(158,206,106,.09); display: block; }
  #diff .del { color: #f7768e; background: rgba(247,118,142,.09); display: block; }
  #diff .hunk { color: #9cdcfe; display: block; }
  #diff .head { color: #858585; display: block; }
  #diff .ctx { color: #d4d4d4; display: block; }
  #commitbar { display: flex; gap: 10px; align-items: flex-end; padding: 10px 12px;
    background: #252526; border-top: 1px solid #3c3c3c; }
  #msg { flex: 1; min-height: 36px; max-height: 90px; resize: vertical; background: #1e1e1e;
    color: #d4d4d4; border: 1px solid #3c3c3c; border-radius: 6px; padding: 8px 10px;
    font: inherit; font-size: 13px; line-height: 1.5; }
  #msg::placeholder { color: #858585; opacity: 1; }
  #bCommit { background: #16825d; color: #fff; border: 0; border-radius: 6px;
    padding: 8px 18px; cursor: pointer; font-size: 13px; min-height: 36px; white-space: nowrap; }
  #bCommit:hover { background: #1a9e70; }
  #bCommit:disabled { background: #3c3c3c; color: #858585; cursor: default; }
  #err { color: #f48771; padding: 4px 12px; font-size: 12.5px; line-height: 1.5; min-height: 22px; }
  #status { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; padding: 8px 12px;
    min-height: 28px; background: #007acc; color: #fff;
    font-size: 12.5px; font-family: Segoe UI, sans-serif; }
  :focus-visible { outline: 2px solid #9cdcfe; outline-offset: 2px; }
  @media (max-width: 700px) {
    #main { flex-direction: column; height: auto; flex: 1; }
    body { display: flex; flex-direction: column; }
    #files { width: 100%; min-width: 0; max-height: 30vh; border-right: 0; border-bottom: 1px solid #3c3c3c; }
    #diff { min-height: 30vh; }
    #commitbar { flex-wrap: wrap; }
    #msg { flex-basis: 100%; }
  }
</style>
</head>
<body>
<div id="bar">
  <h1>🗂️ Panneau Git</h1>
  <button id="bRefresh" type="button" aria-label="Actualiser le statut Git">↻ Actualiser</button>
  <input id="filter" type="search" placeholder="Filtrer les fichiers…" aria-label="Filtrer les fichiers">
  <span id="root">…</span>
</div>
<div id="stats"></div>
<div id="main">
  <div id="files" role="listbox" aria-label="Fichiers modifiés"></div>
  <div id="filesgrip" title="Glisser pour redimensionner" aria-hidden="true"></div>
  <div id="view">
    <div id="fname">—</div>
    <pre id="diff"><span class="head">Choisissez un fichier à gauche pour voir ses modifications…</span></pre>
  </div>
</div>
<div id="err" role="alert"></div>
<div id="commitbar">
  <textarea id="msg" rows="1" placeholder="Message de commit (ex : Corrige l’affichage du panneau)…" aria-label="Message de commit"></textarea>
  <button id="bCommit" type="button">✓ Commit</button>
</div>
<div id="status"><span id="sCount">—</span><span id="sMsg"></span><fieldset id="zoomctl" aria-label="Taille du texte de l'interface"><span class="zl">Texte</span><button class="zstep" type="button" id="zoomOut" title="Réduire la taille du texte" aria-label="Réduire la taille du texte">-</button><span class="zbar"><span class="zfill" id="zfill"></span><input type="range" id="zoomRange" min="0" max="100" step="5" aria-label="Taille du texte en pourcentage"></span><button class="zstep" type="button" id="zoomIn" title="Agrandir la taille du texte" aria-label="Agrandir la taille du texte">+</button><span class="zval" id="zval">100%</span></fieldset></div>
<script>
const $ = (id) => document.getElementById(id);

// Global text size, driven by Chromium's zoom because the stylesheet is all
// px. Range is wider than the hub's: a diff view is mostly text, so being
// able to shrink it hard matters as much as being able to grow it.
const ZOOM_MIN = 0.5, ZOOM_MAX = 3, ZOOM_STEP = 0.05;
const zfill = $("zfill"), zval = $("zval"), zrange = $("zoomRange");
let zoomNow = 1;
function applyZoom(z) {
  zoomNow = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(z * 100) / 100));
  document.body.style.setProperty("--zoom", String(zoomNow));
  try { localStorage.setItem("smolGit.zoom", String(zoomNow)); } catch (e) {}
  const p = Math.round(((zoomNow - ZOOM_MIN) / (ZOOM_MAX - ZOOM_MIN)) * 100);
  zval.textContent = `${Math.round(zoomNow * 100)}%`;
  zfill.style.setProperty("--zpct", String(p));
  zrange.value = String(p);
  return zoomNow;
}
zrange.addEventListener("input", () => { applyZoom(ZOOM_MIN + (Number(zrange.value) / 100) * (ZOOM_MAX - ZOOM_MIN)); });
$("zoomOut").addEventListener("click", () => { applyZoom(zoomNow - ZOOM_STEP); });
$("zoomIn").addEventListener("click", () => { applyZoom(zoomNow + ZOOM_STEP); });
try { applyZoom(parseFloat(localStorage.getItem("smolGit.zoom")) || 1); } catch (e) { applyZoom(1); }

// File column width, previously pinned at 300px with no handle.
(() => {
  const files = $("files"), grip = $("filesgrip");
  try {
    const saved = parseInt(localStorage.getItem("smolGit.filesW"), 10);
    if (saved) files.style.setProperty("--files-w", `${Math.max(200, Math.min(720, saved))}px`);
  } catch (e) {}
  grip.addEventListener("mousedown", (ev) => {
    ev.preventDefault();
    document.body.classList.add("dragging");
    const move = (e) => {
      const w = Math.max(200, Math.min(720, e.clientX - files.getBoundingClientRect().left));
      files.style.setProperty("--files-w", `${w}px`);
    };
    const up = () => {
      document.body.classList.remove("dragging");
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      const w = parseInt(getComputedStyle(files).width, 10);
      if (w) { try { localStorage.setItem("smolGit.filesW", String(w)); } catch (e) {} }
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
})();
const filesEl = $("files"), diffEl = $("diff"), errEl = $("err");
const filterEl = $("filter"), msgEl = $("msg");
let files = [], cur = null, root = "";

function showErr(m) { errEl.textContent = m || ""; }
function badgeOf(f) {
  const b = (f.badge || "M").toUpperCase();
  if (b === "?" || b === "N") return "N";
  if ("AMDR".includes(b)) return b;
  return "M";
}
function badgeTitle(b) {
  return b === "A" ? "Ajouté" : b === "M" ? "Modifié" : b === "D" ? "Supprimé"
    : b === "R" ? "Renommé" : b === "N" ? "Nouveau" : b;
}
function renderFiles() {
  const q = filterEl.value.trim().toLowerCase();
  filesEl.innerHTML = "";
  const shown = files.filter((f) => !q || f.path.toLowerCase().includes(q));
  if (!shown.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = files.length ? "Aucun fichier ne correspond au filtre."
      : "Aucune modification — tout est à jour. ✓";
    filesEl.appendChild(d);
  }
  for (const f of shown) {
    const b = badgeOf(f);
    const row = document.createElement("div");
    row.className = `row${f.path === cur ? " open" : ""}`;
    row.setAttribute("role", "option");
    row.tabIndex = 0;
    const bd = document.createElement("span");
    bd.className = `badge b-${b}`;
    bd.textContent = b;
    bd.title = badgeTitle(b);
    const p = document.createElement("span");
    p.className = "path";
    p.textContent = f.path;
    p.title = f.path;
    row.appendChild(bd);
    row.appendChild(p);
    row.onclick = () => selectFile(f.path);
    row.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectFile(f.path); } };
    filesEl.appendChild(row);
  }
  $("sCount").textContent = files.length
    ? `${files.length} fichier(s) modifié(s)`
    : "aucune modification";
}
function paintDiff(text) {
  diffEl.innerHTML = "";
  if (!text) {
    diffEl.innerHTML = "";
    const s = document.createElement("span");
    s.className = "head";
    s.textContent = "(Aucun diff — fichier nouveau non suivi ou déjà indexé.)";
    diffEl.appendChild(s);
    return;
  }
  const lines = String(text).split("\n");
  const frag = document.createDocumentFragment();
  for (const ln of lines.slice(0, 2000)) {
    const s = document.createElement("span");
    if (ln.startsWith("+") && !ln.startsWith("+++")) s.className = "add";
    else if (ln.startsWith("-") && !ln.startsWith("---")) s.className = "del";
    else if (ln.startsWith("@@")) s.className = "hunk";
    else if (/^(diff --git|index |new file|deleted|rename|Binary|---|---|\+\+\+)/.test(ln)) s.className = "head";
    else s.className = "ctx";
    s.textContent = `${ln}\n`;
    frag.appendChild(s);
  }
  diffEl.appendChild(frag);
  if (lines.length > 2000) {
    const s = document.createElement("span");
    s.className = "head";
    s.textContent = `… diff tronqué à l’affichage (${lines.length} lignes).`;
    diffEl.appendChild(s);
  }
}
async function selectFile(p) {
  cur = p;
  $("fname").textContent = p;
  renderFiles();
  try {
    showErr("");
    const d = await window.smolGit.getDiff(p);
    paintDiff(d?.diff);
  } catch (e) { showErr(e.message || String(e)); }
}
async function refresh() {
  try {
    showErr("");
    $("sMsg").textContent = "lecture…";
    const st = await window.smolGit.getStatus();
    root = st.root || "";
    files = Array.isArray(st.files) ? st.files : [];
    $("root").textContent = root || "dépôt Git";
    $("stats").textContent = (st.stat || "").slice(0, 2000);
    $("sMsg").textContent = `à jour ✓ ${new Date().toLocaleTimeString()}`;
    if (cur && !files.some((f) => f.path === cur)) cur = null;
    if (!cur && files.length) {
      renderFiles();
      selectFile(files[0].path);
    } else {
      renderFiles();
      if (!cur) { $("fname").textContent = "—"; paintDiff(""); }
    }
  } catch (e) { showErr(e.message || String(e)); $("sMsg").textContent = ""; }
}
async function commit() {
  const m = msgEl.value.trim();
  if (!m) { showErr("Écrivez un message de commit avant de valider."); msgEl.focus(); return; }
  try {
    $("bCommit").disabled = true;
    showErr("");
    $("sMsg").textContent = "commit en cours…";
    if (!cur) throw new Error("Choose a file to commit first.");
    const r = await window.smolGit.commit(m, cur);
    msgEl.value = "";
    $("sMsg").textContent = `${r?.summary ? r.summary : "commit créé ✓"} ${new Date().toLocaleTimeString()}`;
    await refresh();
  } catch (e) { showErr(e.message || String(e)); $("sMsg").textContent = ""; }
  finally { $("bCommit").disabled = false; }
}
$("bRefresh").onclick = refresh;
$("bCommit").onclick = commit;
filterEl.oninput = renderFiles;
msgEl.onkeydown = (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") commit();
};
refresh();
</script>
</body>
</html>
