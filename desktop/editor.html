<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smolcoder — Éditeur</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #d4d4d4;
    font-family: Consolas, "Courier New", monospace; font-size: 14px; }
  body { position: relative; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 10px 12px; min-height: 52px;
    background: #252526; border-bottom: 1px solid #3c3c3c; }
  #bar button { background: #0e639c; color: #fff; border: 0; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; font-size: 13px; min-height: 36px; line-height: 1.2; }
  #bar button:hover { background: #1177bb; }
  #bar button:focus-visible { outline: 2px solid #9cdcfe; outline-offset: 2px; }
  #root { color: #9cdcfe; font-size: 12.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.5; }
  #main { display: flex; height: calc(100% - 96px); min-height: 0; }
  #tree { width: 260px; min-width: 180px; overflow: auto; background: #252526;
    border-right: 1px solid #3c3c3c; padding: 8px 6px; line-height: 1.6; }
  #side { display: flex; flex-direction: column; width: 260px; min-width: 180px; min-height: 0; background: #252526; border-right: 1px solid #3c3c3c; }
  #searchBox { display: flex; gap: 4px; padding: 7px; border-bottom: 1px solid #3c3c3c; }
  #searchInput { min-width: 0; flex: 1; background: #1e1e1e; color: #d4d4d4; border: 1px solid #555; padding: 6px; }
  #searchButton { background: #3c3c3c !important; padding: 6px 9px !important; }
  #results { max-height: 32%; overflow: auto; border-bottom: 1px solid #3c3c3c; }
  .result { display: block; width: 100%; text-align: left; color: #d4d4d4; background: transparent; border: 0; padding: 5px 7px; cursor: pointer; font: 12px Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result:hover { background: #37373d; }
  #tree .d { color: #4ec9b0; cursor: pointer; padding: 4px 6px; border-radius: 4px; display: flex; align-items: center; }
    #tree .f { color: #d4d4d4; cursor: pointer; padding: 4px 6px; white-space: nowrap; border-radius: 4px; display: flex; align-items: center; }
    .fileitem-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 16px; padding: 0 3px; font-size: 9.5px; font-weight: 700; font-family: Consolas, monospace; border-radius: 3px; margin-right: 6px; flex-shrink: 0; line-height: 1; }
    .fileitem-icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; font-size: 13px; margin-right: 6px; flex-shrink: 0; }
    .fileitem-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; }
  #tree .f { color: #d4d4d4; cursor: pointer; padding: 6px 8px; white-space: nowrap; border-radius: 4px; }
  #tree .f:hover, #tree .d:hover { background: #2a2d2e; }
  #tree .open { background: #37373d; box-shadow: inset 2px 0 0 #007acc; }
  #editorPane { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }
  #tabs { display: flex; gap: 1px; min-height: 35px; overflow-x: auto; background: #252526; border-bottom: 1px solid #3c3c3c; }
  #findBar { display: none; gap: 5px; align-items: center; flex-wrap: wrap; padding: 6px; background: #252526; border-bottom: 1px solid #3c3c3c; font: 12px Segoe UI, sans-serif; }
  #findBar.open { display: flex; }
  #findBar input { min-width: 80px; width: 22%; padding: 5px 7px; color: #d4d4d4; background: #1e1e1e; border: 1px solid #555; }
  #findBar button { min-height: 28px; padding: 4px 8px; }
  #replaceWrap { display: none; gap: 5px; align-items: center; flex: 1; flex-wrap: wrap; }
  #replaceWrap.open { display: flex; }
  #findCount { color: #aaa; min-width: 90px; }
  .tab { display: flex; align-items: center; flex: none; max-width: 220px; background: #2d2d2d; border-right: 1px solid #1e1e1e; }
  .tab.active { background: #1e1e1e; border-top: 1px solid #007acc; }
  .tab-label, .tab-close { color: #d4d4d4; border: 0; background: transparent !important; border-radius: 0 !important; min-height: 32px !important; padding: 4px 8px !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px Consolas, monospace !important; }
  .tab-label { text-align: left; max-width: 175px; }
  .tab-close { padding: 4px 7px !important; color: #aaa !important; }
  .tab-close:hover { background: #3c3c3c !important; }
  #tree:empty::after { content: "Aucun dossier ouvert — cliquez « Dossier » pour commencer."; display: block; margin: 8px; padding: 20px 12px; color: #858585; font-size: 12.5px; line-height: 1.6; text-align: center; border: 1px dashed #3c3c3c; border-radius: 8px; font-family: Segoe UI, sans-serif; }
  #editorWrap { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; background: #1e1e1e; }
  #codeLayer, #ed { position: absolute; inset: 0; margin: 0; padding: 12px 14px; font: inherit; line-height: 1.6; tab-size: 2; white-space: pre-wrap; overflow: auto; word-wrap: break-word; }
  #codeLayer { pointer-events: none; color: #d4d4d4; }
  #ed { background: transparent; color: transparent; caret-color: #fff; border: 0; outline: none; resize: none; }
  #ed::placeholder { color: #858585; opacity: 1; }
  #ed:focus-visible { outline: 2px solid #007acc; outline-offset: -2px; }
  .tok-key { color: #c586c0; } .tok-str { color: #ce9178; } .tok-num { color: #b5cea8; }
  .sq-err { text-decoration: underline wavy #f14c4c 1px; text-decoration-skip-ink: none; }
  .sq-warn { text-decoration: underline wavy #cca700 1px; text-decoration-skip-ink: none; }
  .diffPreview { max-height: 220px; overflow: auto; background: #101416; border: 1px solid #3c3c3c; font: 12px Consolas, monospace; white-space: pre-wrap; word-break: break-word; padding: 6px 8px; }
  .diffPreview .add { display: block; color: #7ee787; background: rgba(63,185,80,.13); }
  .diffPreview .del { display: block; color: #ffa198; background: rgba(248,81,73,.13); }
  .diffPreview .same { display: block; color: #858585; }
  .diffPreview .hunk { display: block; color: #79c0ff; }
  #inlineBar { display: none; gap: 6px; align-items: center; padding: 6px 12px; background: #252526; border-bottom: 1px solid #3c3c3c; }
  #inlineBar.open { display: flex; }
  #inlineBar input { flex: 1; min-width: 0; background: #1e1e1e; color: #d4d4d4; border: 1px solid #555; padding: 6px 8px; }
  #inlineBar button { background: #0e639c; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #inlinePreview { display: none; border-bottom: 1px solid #3c3c3c; padding: 6px 12px; background: #252526; }
  #inlinePreview.open { display: block; }
  #inlinePreview .row { display: flex; gap: 6px; margin-top: 6px; }
  #inlinePreview .row button { background: #0e639c; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #inlinePreview .row button.reject { background: #5a5a5a; }
  #completePop { display: none; position: absolute; z-index: 6; left: 12px; top: 44px; min-width: 260px; max-width: 70%; max-height: 220px; overflow: auto; background: #252526; border: 1px solid #007acc; box-shadow: 0 8px 24px #0008; }
  #completePop.open { display: block; }
  .completeItem { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid #2d2d2d; color: #d4d4d4; padding: 5px 10px; cursor: pointer; font: 12.5px Consolas, monospace; }
  .completeItem:hover, .completeItem.sel { background: #094771; }
  .completeItem .kind { color: #858585; margin-left: 8px; }
  .tok-com, .tok-c { color: #6a9955; } .tok-lit, .tok-k { color: #c586c0; } .tok-f { color: #dcdcaa; } .tok-o { color: #d4d4d4; } .tok-tag { color: #4ec9b0; } .tok-s { color: #ce9178; } .tok-n { color: #b5cea8; }
  #status { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; padding: 8px 12px; min-height: 28px; background: #007acc; color: #fff;
    font-size: 12.5px; font-family: Segoe UI, sans-serif; }
  #err { color: #f48771; padding: 4px 12px; font-size: 12.5px; line-height: 1.5; min-height: 22px; }
  #diagPanel { display: none; position: absolute; z-index: 5; left: 260px; right: 0; bottom: 58px; max-height: 150px; overflow: auto; background: #181818; border: 1px solid #3c3c3c; box-shadow: 0 8px 24px #0008; font: 12px Segoe UI, sans-serif; }
  #diagPanel.open { display: block; }
  .diagItem { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #292929; padding: 6px 12px; color: #d4d4d4; background: transparent; cursor: pointer; }
  .diagItem:hover { background: #2a2d2e; }
  .diagItem.error { box-shadow: inset 3px 0 #f14c4c; } .diagItem.warning { box-shadow: inset 3px 0 #cca700; }
  :focus-visible { outline: 2px solid #9cdcfe; outline-offset: 2px; }
  @media (max-width: 700px) {
    body { display: flex; flex-direction: column; }
    #bar { flex-wrap: wrap; }
    #main { flex-direction: column; height: auto; flex: 1; }
    #side { width: 100%; min-width: 0; flex: 1; }
    #tree { width: 100%; min-width: 0; max-height: 32vh; border-right: 0; border-bottom: 1px solid #3c3c3c; }
    #ed { min-height: 40vh; }
    #diagPanel { left: 8px; }
  }
</style>
</head>
<body>
<div id="bar">
  <button id="bFolder">📁 Dossier</button>
  <button id="bSave">💾 Enregistrer (Ctrl+S)</button>
  <button id="bDiag" title="Analyser le fichier avec le serveur de langage">✓ Problèmes</button>
  <button id="bInline" title="Modifier la sélection avec l'IA (Ctrl+K)">✨ Inline</button>
  <button id="bNewFile" title="Nouveau fichier">+F</button>
  <button id="bNewFolder" title="Nouveau dossier">+D</button>
  <button id="bRename" title="Renommer le fichier ouvert">✎</button>
  <button id="bDelete" title="Supprimer le fichier ouvert">🗑</button>
  <span id="root">aucun dossier — cliquez « Dossier »</span>
</div>
<div id="inlineBar" role="search"><input id="inlineInput" placeholder="Instruction : ex. ajoute la gestion d'erreur…" aria-label="Instruction d'édition IA"><button id="inlineGo" type="button">Générer</button><button id="inlineCancel" type="button">Fermer</button></div>
<div id="inlinePreview" role="region" aria-label="Aperçu de modification IA"><div class="diffPreview" id="inlineDiff"></div><div class="row"><span id="inlineStatus" style="flex:1;color:#9cdcfe;font:12px Segoe UI,sans-serif;"></span><button id="inlineAccept" type="button">Accepter</button><button id="inlineReject" type="button" class="reject">Rejeter</button></div></div>
<div id="main">
  <div id="side"><div id="searchBox"><input id="searchInput" placeholder="Rechercher dans le projet…" aria-label="Rechercher dans le projet"><button id="searchButton" title="Rechercher">⌕</button></div><div id="results" hidden></div><div id="tree"></div></div>
  <div id="editorPane"><div id="tabs" role="tablist" aria-label="Fichiers ouverts"></div><div id="findBar" role="search"><input id="findInput" aria-label="Rechercher dans le fichier" placeholder="Rechercher dans le fichier"><button id="findPrev" type="button" title="Occurrence précédente (Maj+F3)">↑</button><button id="findNext" type="button" title="Occurrence suivante (F3)">↓</button><span id="findCount" aria-live="polite"></span><div id="replaceWrap"><input id="replaceInput" aria-label="Remplacer par" placeholder="Remplacer par"><button id="replaceOne" type="button">Remplacer</button><button id="replaceAll" type="button">Tout remplacer</button></div><button id="findClose" type="button" aria-label="Fermer la recherche">×</button></div><div id="editorWrap"><pre id="codeLayer" aria-hidden="true"></pre><textarea id="ed" spellcheck="false" placeholder="Choisissez un dossier, puis un fichier…"></textarea><div id="completePop" role="listbox" aria-label="Complétions"></div></div></div>
</div>
<div id="err"></div>
<div id="diagPanel" role="region" aria-label="Problèmes du fichier"></div>
<div id="status"><span id="sFile">—</span><span id="sPosition">Ln 1, Col 1</span><span id="sDirty"></span><span id="sMsg"></span></div>
<script>
const $ = (id) => document.getElementById(id);
const tree = $("tree"), ed = $("ed"), err = $("err");
const results = $("results"), searchInput = $("searchInput");
const tabBar = $("tabs"), tabs = window.smolEd.tabs;
const codeLayer = $("codeLayer");
let root = null, cur = null, dirty = false, folders = { ".": true };
let diagnosticRequest = 0;
let curDiags = [];

function showErr(m) { err.textContent = m || ""; }
function setDirty(d) { dirty = d; $("sDirty").textContent = d ? "● modifié" : ""; }
function join(a, b) { return a === "." ? b : a + "/" + b; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function languageFor(file) { return file ? file.split(".").pop().toLowerCase() : ""; }
var SQ_ERR_OPEN = String.fromCharCode(1), SQ_ERR_CLOSE = String.fromCharCode(2);
var SQ_WARN_OPEN = String.fromCharCode(3), SQ_WARN_CLOSE = String.fromCharCode(4);
function markSquiggles(source) {
  if (!cur || !curDiags.length) return source;
  var lines = String(source).split("\n");
  for (var k = 0; k < curDiags.length; k++) {
    var d = curDiags[k] || {};
    var li = (Number(d.line) || 1) - 1;
    if (li < 0 || li >= lines.length) continue;
    var line = lines[li];
    var col = Math.max(0, Math.min((Number(d.col) || 1) - 1, line.length));
    var end = col;
    while (end < line.length && /[\w$]/.test(line[end])) end++;
    if (end <= col) end = Math.min(line.length, col + 1);
    if (end <= col) continue;
    var isWarn = d.severity === "warning";
    lines[li] = line.slice(0, col) + (isWarn ? SQ_WARN_OPEN : SQ_ERR_OPEN) + line.slice(col, end) + (isWarn ? SQ_WARN_CLOSE : SQ_ERR_CLOSE) + line.slice(end);
  }
  return lines.join("\n");
}
function paint() {
  var html = window.smolEd.highlightCode(markSquiggles(ed.value), languageFor(cur));
  html = html.split(SQ_ERR_OPEN).join('<span class="sq-err">').split(SQ_ERR_CLOSE).join("</span>");
  html = html.split(SQ_WARN_OPEN).join('<span class="sq-warn">').split(SQ_WARN_CLOSE).join("</span>");
  codeLayer.innerHTML = html; codeLayer.scrollTop = ed.scrollTop; codeLayer.scrollLeft = ed.scrollLeft;
}
function updateCursor() { const p = window.smolEd.editorTools.cursorPosition(ed.value, ed.selectionStart); $("sPosition").textContent = "Ln " + p.line + ", Col " + p.column; }
function stashCurrent() { if (cur) tabs.update(cur, ed.value); }
function renderTabs() {
  tabBar.replaceChildren();
  for (const tab of tabs.list()) {
    const item = document.createElement("div"); item.className = "tab" + (tab.path === cur ? " active" : "");
    const label = document.createElement("button"); label.className = "tab-label"; label.type = "button"; label.setAttribute("role", "tab"); label.setAttribute("aria-selected", String(tab.path === cur));
    label.textContent = (tab.dirty ? "● " : "") + tab.path.split("/").pop(); label.title = tab.path; label.onclick = () => activateTab(tab.path);
    const close = document.createElement("button"); close.className = "tab-close"; close.type = "button"; close.textContent = "×"; close.title = "Fermer " + tab.path; close.setAttribute("aria-label", "Fermer " + tab.path); close.onclick = () => closeTab(tab.path);
    item.append(label, close); tabBar.appendChild(item);
  }
}
function showTab(tab) {
  cur = tab ? tab.path : null;
  curDiags = [];
  ed.value = tab ? tab.content : ""; paint(); setDirty(!!(tab && tab.dirty));
  updateCursor();
  $("sFile").textContent = tab ? tab.path : "—"; $("sMsg").textContent = "";
  renderTabs(); refreshTree();
  if (tab && /\.(?:[cm]?js|jsx|tsx?)$/i.test(tab.path)) void analyzeCurrent();
  else { diagnosticRequest++; $("diagPanel").classList.remove("open"); $("diagPanel").replaceChildren(); }
}
function activateTab(filePath) { stashCurrent(); const tab = tabs.activate(filePath); if (tab) showTab(tab); }
function closeTab(filePath) {
  stashCurrent();
  const tab = tabs.list().find((item) => item.path === filePath);
  if (!tab || (tab.dirty && !confirm("Fermer " + filePath + " sans enregistrer ses modifications ?"))) return;
  const result = tabs.close(filePath, tab.dirty);
  if (result.closed) showTab(result.active);
}

function getFileItemHtml(name, isDir, depth) {
  var safeName = String(name || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  var indent = (depth && depth > 0) ? '<span style="display:inline-block;width:' + (depth * 14) + 'px;flex-shrink:0;"></span>' : "";
  if (isDir) {
    var folderSvg = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-right:6px;"><path d="M1.5 3A1.5 1.5 0 0 1 3 1.5h3.1a1.5 1.5 0 0 1 1.06.44L8.5 3.25H13A1.5 1.5 0 0 1 14.5 4.75v8a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 12.75V3z" fill="#E8B839"/><path d="M1.5 5.5h13v7.25a1.25 1.25 0 0 1-1.25 1.25H2.75A1.25 1.25 0 0 1 1.5 12.75V5.5z" fill="#F4CF65"/></svg>';
    return indent + folderSvg + '<span class="fileitem-name" style="color:#fde047;font-weight:500;">' + safeName + '</span>';
  }
  var lower = String(name || "").toLowerCase();
  var ext = lower.indexOf(".") !== -1 ? lower.split(".").pop() : "";
  var iconSvg = '';
  var nameColor = '#e2e8f0';

  if (lower.indexOf(".env") === 0 || lower.indexOf(".git") === 0 || lower === "dockerfile" || ext === "yml" || ext === "yaml" || ext === "toml") {
    if (lower.indexOf(".git") === 0) {
      iconSvg = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-right:6px;"><rect width="16" height="16" rx="2" fill="#2b1b1a"/><path d="M13.2 7.1L8.9 2.8a1 1 0 0 0-1.4 0L6.1 4.2l1.8 1.8a1.2 1.2 0 0 1 1.5 1.5l1.7 1.7a1.2 1.2 0 1 1-.7.7l-1.6-1.6v3.2a1.2 1.2 0 1 1-1 0v-4.5a1.2 1.2 0 0 1-.6-1.5L5.4 3.5 2.8 6.1a1 1 0 0 0 0 1.4l4.3 4.3a1 1 0 0 0 1.4 0l4.7-4.7z" fill="#F05032"/></svg>';
      nameColor = '#f87171';
    } else {
      iconSvg = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-right:6px;"><rect width="16" height="16" rx="2" fill="#23272e"/><circle cx="8" cy="8" r="2.5" stroke="#94A3B8" stroke-width="1.2"/><path d="M8 2.5v1.2M8 12.3v1.2M2.5 8h1.2M12.3 8h1.2M4.1 4.1l.9.9M11 11l.9.9M4.1 11.9l.9-.9M11 5l.9-.9" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/></svg>';
      nameColor = '#cbd5e1';
    }
  } else {
    switch (ext) {
      case "js":
      case "mjs":
      case "cjs":
        iconSvg = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-right:6px;"><rect width="16" height="16" rx="2" fill="#F7DF1E"/><text x="3.5" y="12.5" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="900" fill="#000000">JS</text></svg>';
        nameColor = "#fef08a";
        break;
      case "ts":
      case "mts":
      case "cts":
        iconSvg = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-right:6px;"><rect width="16" height="16" rx="2" fill="#3178C6"/><text x="3" y="12.5" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="900" fill="#FFFFFF">TS</text></svg>';
        nameColor = "#bae6fd";
        break;
      case "jsx":
      case "tsx":
        iconSvg = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-right:6px;"><circle cx="8" cy="8" r="1.6" fill="#61DAFB"/><ellipse cx="8" cy="8" rx="6.5" ry="2.5" stroke="#61DAFB" stroke-width="1.1" transform="rotate(30 8 8)"/><ellipse cx="8" cy="8" rx="6.5" ry="2.5" stroke="#61DAFB" stroke-width="1.1" transform="rotate(90 8 8)"/><ellipse cx="8" cy="8" rx="6.5" ry="2.5" stroke="#61DAFB" stroke-width="1.1" transform="rotate(150 8 8)"/></svg>';
        nameColor = "#a5f3fc";
        break;
      case "py":
      case "pyw":
        iconSvg = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-right:6px;"><path d="M7.9 1.5c-3.1 0-2.9 1.3-2.9 1.3v1.4h3v.4H3.8s-1.8.2-1.8 2.7 1.6 2.6 1.6 2.6h.9V8.6s-.1-1.6 1.6-1.6h2.7s1.5 0 1.5-1.5V3s.2-1.5-2.2-1.5zm-1.6.9c.3 0 .5.2.5.5s-.2.5-.5.5-.5-.2-.5-.5.2-.5.5-.5z" fill="#3776AB"/><path d="M8.1 14.5c3.1 0 2.9-1.3 2.9-1.3v-1.4h-3v-.4h4.2s1.8-.2 1.8-2.7-1.6-2.6-1.6-2.6h-.9v1.3s.1 1.6-1.6 1.6H7.2s-1.5 0-1.5 1.5V13s-.2 1.5 2.4 1.5zm1.6-.9c-.3 0-.5-.2-.5-.5s.2-.5.5-.5.5.2.5.5-.2.5-.5.5z" fill="#FFD43B"/></svg>';
        nameColor = "#bfdbfe";
        break;
      case "html":
      case "htm":

  } catch (e) {
