<title>Smolcoder — Éditeur</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #d4d4d4;
    font-family: Consolas, "Courier New", monospace; font-size: 14px; }
  body { position: relative; zoom: var(--zoom, 1); }
  #bar { display: flex; gap: 10px; align-items: center; padding: 10px 12px; min-height: 52px;
    background: #252526; border-bottom: 1px solid #3c3c3c; }
  #bar button { background: #0e639c; color: #fff; border: 0; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; font-size: 13px; min-height: 36px; line-height: 1.2; }
  #bar button:hover { background: #1177bb; }
  #bar button:focus-visible { outline: 2px solid #9cdcfe; outline-offset: 2px; }

  #main { display: flex; height: calc(100% - 96px); min-height: 0; }
  #tree { width: 260px; min-width: 180px; overflow: auto; background: #252526;

  #side { display: flex; flex-direction: column; width: var(--side-w, 260px); min-width: 180px; min-height: 0; background: #252526; border-right: 1px solid #3c3c3c; }
  /* Drag handle on the sidebar edge. The panel width used to be hard-coded at
     260px with no way to change it, which is what made the file list eat
     space the code needed. */
  #sidegrip { position: relative; flex: 0 0 7px; margin-left: -3px; margin-right: -3px; z-index: 9; cursor: col-resize; background: transparent; }
  #sidegrip:hover, body.dragging #sidegrip { background: #007acc; }
  /* Text-size control. The stylesheet is all px, so scaling the root font
     would change nothing; Chromium's zoom is what rescales everything. */
  #zoomctl { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  #zoomctl .zl { color: #dcdcdc; font-size: 11px; }
  #zoomctl .zbar { position: relative; width: 96px; height: 16px; display: flex; align-items: center; }
  #zoomctl .zbar::before { content: ""; position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: #1b242a; }
  #zoomctl .zfill { position: absolute; left: 0; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #24727f, #43c6d6, #93f2ff); width: calc(var(--zpct, 0) * 1%); }
  #zoomctl input[type="range"] { position: relative; z-index: 2; width: 100%; height: 16px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
  #zoomctl input[type="range"]::-webkit-slider-runnable-track { height: 16px; background: transparent; }
  #zoomctl input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; margin-top: 2px; border-radius: 50%; background: #fff; border: 1px solid #007acc; }
  #zoomctl input[type="range"]::-moz-range-track { height: 16px; background: transparent; }
  #zoomctl input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 1px solid #007acc; }
  #zoomctl input[type="range"]:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #zoomctl .zval { min-width: 38px; text-align: right; color: #fff; font-size: 11px; font-variant-numeric: tabular-nums; }
  #zoomctl .zstep { width: 20px; height: 20px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(255,255,255,.45); border-radius: 4px; color: #fff; cursor: pointer; line-height: 1; }
  #zoomctl .zstep:hover { background: rgba(255,255,255,.18); }
  #searchBox { display: flex; gap: 4px; padding: 7px; border-bottom: 1px solid #3c3c3c; }
  #searchInput { min-width: 0; flex: 1; background: #1e1e1e; color: #d4d4d4; border: 1px solid #555; padding: 6px; }
  #searchBox #searchButton { background: #3c3c3c; padding: 6px 9px; }
  #results { max-height: 32%; overflow: auto; border-bottom: 1px solid #3c3c3c; }
  .result { display: block; width: 100%; text-align: left; color: #d4d4d4; background: transparent; border: 0; padding: 5px 7px; cursor: pointer; font: 12px Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result:hover { background: #37373d; }
  #tree .d { color: #4ec9b0; cursor: pointer; padding: 4px 6px; border-radius: 4px; display: flex; align-items: center; }
    #tree .f { color: #d4d4d4; cursor: pointer; padding: 4px 6px; white-space: nowrap; border-radius: 4px; display: flex; align-items: center; }
    .fileitem-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 21px; padding: 0 5px; font-size: 13px; font-weight: 900; font-family: Consolas, monospace; border-radius: 4px; margin-right: 7px; flex-shrink: 0; line-height: 1; }
    .fileitem-badge.status-m { color: #e3b341; background: rgba(227,179,65,.14); }
    .fileitem-badge.status-a, .fileitem-badge.status-u { color: #3fb950; background: rgba(63,185,80,.15); }
    .fileitem-badge.status-d { color: #f85149; background: rgba(248,81,73,.15); }
    .fileitem-badge.status-r { color: #d2a8ff; background: rgba(210,168,255,.15); }
    .fileitem-icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; font-size: 13px; margin-right: 6px; flex-shrink: 0; }
    .fileitem-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; }
  #tree .f { color: #d4d4d4; cursor: pointer; padding: 6px 8px; white-space: nowrap; border-radius: 4px; }
  #tree .f:hover, #tree .d:hover { background: #2a2d2e; }
  #tree .open { background: #37373d; box-shadow: inset 2px 0 0 #007acc; }
  #editorPane { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }
  #tabs { display: flex; gap: 1px; min-height: 35px; overflow-x: auto; background: #252526; border-bottom: 1px solid #3c3c3c; }
  #findBar { display: none; gap: 5px; align-items: center; flex-wrap: wrap; padding: 6px; background: #252526; border-bottom: 1px solid #3c3c3c; font: 12px Segoe UI, sans-serif; }
  #findBar.open { display: flex; }

  #findBar button { min-height: 28px; padding: 4px 8px; }
  #replaceWrap { display: none; gap: 5px; align-items: center; flex: 1; flex-wrap: wrap; }
  #replaceWrap.open { display: flex; }
  #findCount { color: #aaa; min-width: 90px; }
  .tab { display: flex; align-items: center; flex: none; max-width: 220px; background: #2d2d2d; border-right: 1px solid #1e1e1e; }
  .tab.active { background: #1e1e1e; border-top: 1px solid #007acc; }
  #tabs .tab-label, #tabs .tab-close { color: #d4d4d4; border: 0; background: transparent; border-radius: 0; min-height: 32px; padding: 4px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px Consolas, monospace; }
  #tabs .tab-label { text-align: left; max-width: 175px; }
  #tabs .tab-close { padding: 4px 7px; color: #aaa; }
  #tabs .tab-close:hover { background: #3c3c3c; }
  #tree:empty::after { content: "Aucun dossier ouvert — cliquez « Dossier » pour commencer."; display: block; margin: 8px; padding: 20px 12px; color: #858585; font-size: 12.5px; line-height: 1.6; text-align: center; border: 1px dashed #3c3c3c; border-radius: 8px; font-family: Segoe UI, sans-serif; }
  #editorWrap { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; background: #1e1e1e; }
  #imagePreview { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; background: #1e1e1e; font: 12px Segoe UI, sans-serif; color: #aaa; }
  #imagePreview[hidden] { display: none; }
  #imagePreview img { display: block; max-width: 100%; max-height: calc(100% - 32px); object-fit: contain; }
  #bar button:disabled { opacity: .55; cursor: not-allowed; }
  #codeLayer, #ed { position: absolute; inset: 0; margin: 0; padding: 12px 14px; font: inherit; line-height: 1.6; tab-size: 2; white-space: pre-wrap; overflow: auto; word-wrap: break-word; }
  #codeLayer { pointer-events: none; color: #9cdcfe; }
  #ed { background: transparent; color: transparent; caret-color: #fff; border: 0; outline: none; resize: none; }
  #ed::placeholder { color: #858585; opacity: 1; }
  #ed:focus-visible { outline: 2px solid #007acc; outline-offset: -2px; }
  .tok-key { color: #c586c0; } .tok-str { color: #ce9178; } .tok-num { color: #b5cea8; } .tok-t { color: #4ec9b0; } .tok-d { color: #e5c07b; }
  .sq-err { text-decoration: underline wavy #f14c4c 1px; text-decoration-skip-ink: none; }
  .sq-warn { text-decoration: underline wavy #cca700 1px; text-decoration-skip-ink: none; }
  .diffPreview { max-height: 220px; overflow: auto; background: #101416; border: 1px solid #3c3c3c; font: 12px Consolas, monospace; white-space: pre-wrap; word-break: break-word; padding: 6px 8px; }
  .diffPreview .add { display: block; color: #7ee787; background: rgba(63,185,80,.13); }
  .diffPreview .del { display: block; color: #ffa198; background: rgba(248,81,73,.13); }
  .diffPreview .same { display: block; color: #858585; }
  .diffPreview .hunk { display: block; color: #79c0ff; }
  #inlineBar { display: none; gap: 6px; align-items: center; padding: 6px 12px; background: #252526; border-bottom: 1px solid #3c3c3c; }
  #inlineBar.open { display: flex; }
  #inlineBar input { flex: 1; min-width: 0; background: #1e1e1e; color: #d4d4d4; border: 1px solid #555; padding: 6px 8px; }
  #inlineBar button { background: #0e639c; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #inlinePreview { display: none; border-bottom: 1px solid #3c3c3c; padding: 6px 12px; background: #252526; }
  #inlinePreview.open { display: block; }
  #inlinePreview .row { display: flex; gap: 6px; margin-top: 6px; }
  #inlinePreview .row button { background: #0e639c; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #inlinePreview .row button.reject { background: #5a5a5a; }
  #completePop { display: none; position: absolute; z-index: 6; left: 12px; top: 44px; min-width: 260px; max-width: 70%; max-height: 220px; overflow: auto; background: #252526; border: 1px solid #007acc; box-shadow: 0 8px 24px #0008; }
  #completePop.open { display: block; }
  .completeItem { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid #2d2d2d; color: #d4d4d4; padding: 5px 10px; cursor: pointer; font: 12.5px Consolas, monospace; }
  .completeItem:hover, .completeItem.sel { background: #094771; }
  .completeItem .kind { color: #858585; margin-left: 8px; }
  .tok-com, .tok-c { color: #6a9955; font-style: italic; }
  .tok-k { color: #569cd6; font-weight: 600; }
  .tok-control { color: #c586c0; font-weight: 600; }
  .tok-bool { color: #569cd6; font-weight: 600; }
  .tok-s { color: #ce9178; }
  .tok-regex { color: #d16969; }
  .tok-f { color: #dcdcaa; font-weight: 500; }
  .tok-prop { color: #9cdcfe; }
  .tok-v { color: #9cdcfe; }
  .tok-const { color: #4fc1ff; font-weight: 600; }
  .tok-t { color: #4ec9b0; font-weight: 600; }
  .tok-n { color: #b5cea8; }
  .tok-d { color: #dcdcaa; }
  .tok-tag { color: #569cd6; font-weight: 600; }
  .tok-o { color: #80c7ff; }
  .tok-b1 { color: #ffd700; font-weight: 600; }
  .tok-b2 { color: #da70d6; font-weight: 600; }
  .tok-b3 { color: #179fff; font-weight: 600; }
  /* ---- Barre d'état officielle VS Code ---- */
  .vsc-statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 22px;
    background: #007acc;
    color: #ffffff;

  }
  .vsc-sb-left, .vsc-sb-right {
    display: flex;
    align-items: center;
    height: 100%;
    gap: 2px;
  }
  .vsc-sb-item {
    background: transparent;
    border: none;
    color: #ffffff;
    height: 22px;
    padding: 0 6px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: inherit;

  }
  .vsc-sb-item:hover {
    background: rgba(255, 255, 255, 0.2);
  }
  .vsc-sb-item:active {
    background: rgba(255, 255, 255, 0.3);
  }
  .vsc-sb-ico {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
  }
  .vsc-sb-ico.vsc-err {
    color: #ffd7d7;
  }
  .vsc-sb-ico.vsc-warn {
    color: #fff3c4;
  }
  #err { color: #f48771; padding: 4px 12px; font-size: 12.5px; line-height: 1.5; min-height: 22px; }
  #diagPanel { display: none; position: absolute; z-index: 5; left: 260px; right: 0; bottom: 58px; max-height: 150px; overflow: auto; background: #181818; border: 1px solid #3c3c3c; box-shadow: 0 8px 24px #0008; font: 12px Segoe UI, sans-serif; }
  #diagPanel.open { display: block; }
  .diagItem { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #292929; padding: 6px 12px; color: #d4d4d4; background: transparent; cursor: pointer; }
  .diagItem:hover { background: #2a2d2e; }
  .diagItem.error { box-shadow: inset 3px 0 #f14c4c; } .diagItem.warning { box-shadow: inset 3px 0 #cca700; }
  :focus-visible { outline: 2px solid #9cdcfe; outline-offset: 2px; }
  @media (max-width: 700px) {
    body { display: flex; flex-direction: column; }
    #bar { flex-wrap: wrap; }
    #main { flex-direction: column; height: auto; flex: 1; }

    #tree { width: 100%; min-width: 0; max-height: 32vh; border-right: 0; border-bottom: 1px solid #3c3c3c; }
    #ed { min-height: 40vh; }
    #diagPanel { left: 8px; }
  }
</style>

<script>

function monacoLanguageFor(file) {
  if (!file) return "plaintext";
  const ext = file.split(".").pop().toLowerCase();
  const map = {
    js: "javascript", mjs: "javascript", cjs: "javascript",
    ts: "typescript", mts: "typescript", cts: "typescript",
    jsx: "javascript", tsx: "typescript",
    html: "html", htm: "html",
    css: "css", scss: "scss", less: "less",
    json: "json",
    md: "markdown", markdown: "markdown",
    py: "python", pyw: "python",
    sh: "shell", bash: "shell", bat: "bat", cmd: "bat", ps1: "powershell",
    rs: "rust", go: "go",
    c: "c", cpp: "cpp", h: "c", hpp: "cpp",
    java: "java",
    yml: "yaml", yaml: "yaml",
    toml: "ini", sql: "sql", xml: "xml"
  };
  return map[ext] || "plaintext";
}

    try {
      window.require.config({ paths: { vs: "../node_modules/monaco-editor/min/vs" } });
      window.MonacoEnvironment = {

          return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
            self.MonacoEnvironment = {

// file list always took space away from the code.

    const saved = parseInt(localStorage.getItem("smolEditor.sideW"), 10);

  } catch (e) {}
  grip.addEventListener("mousedown", (ev) => {
    ev.preventDefault();

    const move = (e) => {
      const w = Math.max(180, Math.min(720, e.clientX - side.getBoundingClientRect().left));

  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "f") { e.preventDefault(); searchInput.focus(); searchInput.select(); }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "g") {
    e.preventDefault(); const line = Number(prompt("Aller à la ligne :", String(window.smolEd.editorTools.cursorPosition(ed.value, ed.selectionStart).line)));
    if (Number.isFinite(line) && line > 0) { const pos = window.smolEd.editorTools.offsetForPosition(ed.value, line); ed.focus(); ed.setSelectionRange(pos, pos); updateCursor(); }
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "k") { e.preventDefault(); openInlineBar(); }
  if (e.key === "Escape" && $("inlineBar").classList.contains("open")) closeInlineBar();
});

(async () => {
  try {
    const sug = await window.smolEd.suggestRoot();
    if (sug) setRoot(sug);
  } catch (e) { /* l'utilisateur choisira */ }
})();

async function refreshDesktopGitStatus() {
  if (!root) return null;
  const [repo, sync] = await Promise.all([window.smolEd.gitStatus(), window.smolEd.gitSyncStatus()]);
  $("sb-branch-name").textContent = sync.error ? "Git ?" : repo.branch || "(detached)";
  $("sb-branch").title = `Branche locale : ${repo.branch || "(detached)"}`;
  const syncText = $("sb-sync-text");
  if (sync.error || !sync.upstream || sync.ahead === null || sync.behind === null) {
    syncText.textContent = "—";
    $("sb-sync").title = sync.error || "Aucune référence upstream configurée; aucun fetch/push effectué.";
  } else {
    syncText.textContent = `${sync.behind}↓ ${sync.ahead}↑`;
    $("sb-sync").title = `${sync.behind} en retard, ${sync.ahead} en avance sur ${sync.upstream} (référence locale; aucun fetch/push).`;
  }
  return sync;
}

// Câblage interactif Status Bar
if ($("sb-problems")) $("sb-problems").onclick = () => { if ($("bDiag")) $("bDiag").click(); };
if ($("sb-branch")) $("sb-branch").onclick = async () => {
  try {
    const sync = await refreshDesktopGitStatus();
    alert(sync?.error || `Branche locale : ${sync?.branch || "(detached)"}`);
  } catch (e) { showErr(e.message); }
};
if ($("sb-sync")) $("sb-sync").onclick = async () => {
  try {
    const sync = await refreshDesktopGitStatus();
    if (!sync || sync.error) { alert(sync?.error || "Statut Git indisponible."); return; }
    alert(sync.upstream && sync.ahead !== null && sync.behind !== null
      ? `${sync.behind} commit(s) en retard, ${sync.ahead} en avance sur ${sync.upstream}.\nComparaison locale uniquement : aucun fetch/push effectué.`
      : "Aucune référence upstream configurée. Aucun fetch/push effectué.");
  } catch (e) { showErr(e.message); }
};
let desktopIndent = 2;
if ($("sb-indent")) $("sb-indent").onclick = () => {
  desktopIndent = desktopIndent === 2 ? 4 : 2;
    if ($("sb-indent-text")) $("sb-indent-text").textContent = `Espaces : ${desktopIndent}`;
};
if ($("sb-eol")) $("sb-eol").onclick = () => {
  const current = $("sb-eol").textContent;
  if (current === "LF") {
    ed.value = ed.value.replace(/\r?\n/g, "\r\n");
    $("sb-eol").textContent = "CRLF";
  } else {
    ed.value = ed.value.replace(/\r\n/g, "\n");
    $("sb-eol").textContent = "LF";
  }
  paint();
};
if ($("sb-encoding")) $("sb-encoding").onclick = () => alert("Encodage : UTF-8 (sans BOM)");
if ($("sb-formatter")) $("sb-formatter").onclick = () => alert("Le formatage depuis la barre d’état n’est pas encore relié à l’éditeur.");
if ($("sb-lang")) $("sb-lang").onclick = () => alert("Le mode de langage est déterminé par l’extension du fichier; le remplacement manuel n’est pas encore disponible.");
if ($("sb-blame")) $("sb-blame").onclick = async () => {
  if (!cur) { showErr("Ouvrez un fichier suivi par Git pour afficher son auteur."); return; }
  try {
    const line = window.smolEd.editorTools.cursorPosition(ed.value, ed.selectionStart).line;
    const result = await window.smolEd.gitBlame(cur, line);
    $("sb-blame-text").textContent = result.startsWith("Error:") ? "Git blame indisponible" : result.slice(0, 60);
    $("sb-blame").title = result;
  } catch (e) { showErr(e.message); }
};

let lastBackendData = null;
async function refreshBackendStatus() {
  const item = $("sb-backend");
  if (!item || !window.smolEd?.backendStatus) return;
  try {
    const data = await window.smolEd.backendStatus();
    lastBackendData = data;
    const dot = $("sb-backend-dot");
    const txt = $("sb-backend-text");
    const online = data.ollamaOnline || data.lmStudioOnline;
    if (dot) {
      dot.textContent = online ? "🟢" : "🔴";
      dot.style.color = online ? "#7ee787" : "#ff7b72";
    }
    if (txt) {
      if (!online) {
        txt.textContent = "LLM hors ligne";
        item.title = "Ollama & LM Studio indisponibles (11434 / 1234)";
      } else {
        const engine = data.ollamaOnline ? "Ollama" : "LM Studio";
        const loaded = (data.loaded?.[0]) ? data.loaded[0].name : "aucun modèle chargé";
        const vramStr = data.totalVramMb ? (data.totalVramMb >= 1024 ? ` ${(data.totalVramMb / 1024).toFixed(1)} Go` : ` ${data.totalVramMb} Mo`) : "";
        txt.textContent = `${engine}: ${loaded}${vramStr}`;
        item.title = `${engine} en ligne · ${(data.loaded || []).length} modèle(s) actif(s) · VRAM: ${data.totalVramMb || 0} Mo\nCliquez pour afficher le diagnostic complet.`;
      }
    }
  } catch (e) {
    if ($("sb-backend-text")) $("sb-backend-text").textContent = "LLM : statut indisponible";
  }
}
if ($("sb-backend")) {
  $("sb-backend").onclick = () => {
    if (!lastBackendData) { alert("Diagnostic backend en cours de détection…"); return; }
    const d = lastBackendData;
    const engines = `Ollama : ${d.ollamaOnline ? "🟢 Connecté (port 11434)" : "🔴 Hors ligne"}\nLM Studio : ${d.lmStudioOnline ? "🟢 Connecté (port 1234)" : "🔴 Hors ligne"}`;
    const models = (d.loaded?.length)
      ? d.loaded.map((m) => `• ${m.name} (${m.backend}) : ${m.sizeVramMb ? `${m.sizeVramMb} Mo VRAM` : (m.sizeMb ? `${m.sizeMb} Mo` : "Actif")}`).join("\n")
      : "Aucun modèle résident en mémoire (il sera chargé à la première requête)";
    const vram = `VRAM totale estimée : ${d.totalVramMb ? (d.totalVramMb >= 1024 ? `${(d.totalVramMb / 1024).toFixed(1)} Go` : `${d.totalVramMb} Mo`) : "0 Mo"}`;
    alert(`=== Diagnostic Moteurs Locaux & VRAM ===\n\n${engines}\n\n${vram}\n\nModèles résidents :\n${models}`);
  };
}
void refreshBackendStatus();
setInterval(() => { void refreshBackendStatus(); }, 8000);
void initMonaco();
window.addEventListener("resize", () => {
  if (monacoInstance) monacoInstance.layout();
});
</script>
</body>
</html>
